services:
  postgres:
    image: postgres:16
    container_name: smartcity_pg
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    container_name: smartcity_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: smartcity
    ports:
      # Recibe MONGO_PORT de .env (27017 por defecto); publica ese puerto del equipo hacia el 27017 del contenedor.
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
      - transfer:/transfer

  # hadoop: namenode guarda el mapa de bloques
  namenode:
    image: apache/hadoop:3.4.1
    container_name: smartcity_namenode
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    env_file: ./hadoop/config
    environment:
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
    ports:
      - "9870:9870"
    volumes:
      - hdfs_namenode:/hadoop/dfs
      - ./data/raw:/datos/raw:ro
      - ./hadoop:/proyecto/hadoop
      - transfer:/transfer

  # datanode guarda los bloques
  datanode:
    image: apache/hadoop:3.4.1
    container_name: smartcity_datanode
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file: ./hadoop/config
    volumes:
      - hdfs_datanode:/hadoop/dfs
    depends_on:
      - namenode

  # yarn reparte los trabajos de mapreduce
  resourcemanager:
    image: apache/hadoop:3.4.1
    container_name: smartcity_resourcemanager
    hostname: resourcemanager
    user: root
    command: ["yarn", "resourcemanager"]
    env_file: ./hadoop/config
    ports:
      - "8088:8088"
    depends_on:
      - namenode

  # este corre los map y reduce, por eso lleva python
  nodemanager:
    build: ./hadoop
    image: smartcity-hadoop-python:3.4.1
    container_name: smartcity_nodemanager
    hostname: nodemanager
    user: root
    command: ["yarn", "nodemanager"]
    env_file: ./hadoop/config
    depends_on:
      - resourcemanager

  # spark: el master recibe los trabajos
  spark-master:
    image: apache/spark:3.5.9-python3
    container_name: smartcity_spark_master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      PG_DB: ${PG_DB}
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
    ports:
      - "8080:8080"
      - "4040:4040"
    volumes:
      - ./spark:/proyecto/spark
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro

  # el worker hace el trabajo (2 nucleos, 2 gb)
  spark-worker:
    image: apache/spark:3.5.9-python3
    container_name: smartcity_spark_worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_MEMORY: 2g
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/proyecto/spark
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark/log4j2.properties:/opt/spark/conf/log4j2.properties:ro
    depends_on:
      - spark-master

volumes:
  pg_data:
  mongo_data:
  hdfs_namenode:
  hdfs_datanode:
  # volumen para pasar el export de mongo a hdfs
  transfer:
